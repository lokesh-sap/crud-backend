name: Java Spring Boot Security Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      # Set up Java and build the app
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      # Scan for dependency vulnerabilities with Snyk
      - name: Snyk Code and Dependency Scan
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: false

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t spring-boot-app .

      # Scan Docker image vulnerabilities with Trivy
      - name: Trivy Docker Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'spring-boot-app:latest'
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      # Optional: Scan Infrastructure-as-Code with Checkov
      - name: Checkov IaC Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: false
